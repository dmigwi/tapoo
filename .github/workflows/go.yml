name: Go CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  code-quality: write

env:
  GOFLAGS: -mod=readonly

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - lint

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Download dependencies
        run: go mod download

      - name: Verify module dependencies
        run: go mod verify

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare coverage directories
        run: mkdir -p .tmp/frontend-coverage

      - name: Type-check frontend
        run: pnpm run typecheck:frontend

      - name: Run frontend tests with coverage
        env:
          VITEST_COVERAGE_DIR: .tmp/frontend-coverage
        run: pnpm run coverage:frontend

      - name: Build frontend
        run: pnpm run build:frontend

      - name: Run tests with coverage
        run: go test -race -covermode=atomic -coverprofile=.tmp/go-coverage.out -v ./...

      - name: Install gocover-cobertura
        run: go install github.com/t-yuki/gocover-cobertura@aaee18c8195c3f2d90e5ef80ca918d265463842a

      - name: Convert Go coverage to Cobertura XML
        run: $(go env GOPATH)/bin/gocover-cobertura < .tmp/go-coverage.out > .tmp/go-coverage.xml

      - name: Generate coverage summary
        run: |
          {
            echo '## Test Coverage'
            echo
            echo '```text'
            go tool cover -func=.tmp/go-coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Go coverage report to GitHub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: .tmp/go-coverage.xml
          language: Go
          label: code-coverage/go
          fail-on-error: false

      - name: Upload frontend coverage report to GitHub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: .tmp/frontend-coverage/cobertura-coverage.xml
          language: JavaScript
          label: code-coverage/frontend
          fail-on-error: false

  benchmark:
    name: Maze Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - test
    # Pull requests run these too, scoped to the files that can move the numbers. The parity gate is
    # only useful before a merge, not after it, and the whole sweep costs about eight seconds.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/master')

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          # Full history so a pull request can be diffed against its base commit below.
          fetch-depth: 0

      # The workflow has no path filters, because every other job here should run on any change. The
      # scoping therefore happens per job rather than at the trigger.
      - name: Decide whether generation changed
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$BASE_SHA" HEAD | grep -qE '^(maze/|frontend/bench/|frontend/app/(maze|traversal|config)\.ts|scripts/bench-report\.mjs|vitest\.bench\.config\.ts)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        if: steps.scope.outputs.run == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        if: steps.scope.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        if: steps.scope.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Run maze branching benchmarks
        if: steps.scope.outputs.run == 'true'
        run: make ci-bench

      # Uploaded even when the parity gate fails, since the report is what identifies which cases
      # diverged. The console log is not a usable history: comparing a metric against an earlier
      # commit otherwise means opening two runs and reading them side by side.
      - name: Upload benchmark report
        if: always() && steps.scope.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: maze-benchmark-report-${{ github.sha }}
          path: bench-report.json
          if-no-files-found: error
          retention-days: 90
