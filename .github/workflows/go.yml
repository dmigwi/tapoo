name: Go CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  code-quality: write

env:
  GOFLAGS: -mod=readonly

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.5.0 ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - lint

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Download dependencies
        run: go mod download

      - name: Verify module dependencies
        run: go mod verify

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare coverage directories
        run: mkdir -p .tmp/frontend-coverage

      - name: Type-check frontend
        run: pnpm run typecheck:frontend

      - name: Run frontend tests with coverage
        env:
          VITEST_COVERAGE_DIR: .tmp/frontend-coverage
        run: pnpm run coverage:frontend

      - name: Build frontend
        run: pnpm run build:frontend

      - name: Run tests with coverage
        run: go test -race -covermode=atomic -coverprofile=.tmp/go-coverage.out -v ./...

      - name: Install gocover-cobertura
        run: go install github.com/t-yuki/gocover-cobertura@aaee18c8195c3f2d90e5ef80ca918d265463842a

      - name: Convert Go coverage to Cobertura XML
        run: $(go env GOPATH)/bin/gocover-cobertura < .tmp/go-coverage.out > .tmp/go-coverage.xml

      - name: Generate coverage summary
        run: |
          {
            echo '## Test Coverage'
            echo
            echo '```text'
            go tool cover -func=.tmp/go-coverage.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Go coverage report to GitHub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: .tmp/go-coverage.xml
          language: Go
          label: code-coverage/go
          fail-on-error: false

      - name: Upload frontend coverage report to GitHub
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/upload-code-coverage@v1
        with:
          file: .tmp/frontend-coverage/cobertura-coverage.xml
          language: JavaScript
          label: code-coverage/frontend
          fail-on-error: false
