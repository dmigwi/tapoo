<section id="terminal-app" class="terminal-app" tabindex="0" aria-hidden="true" aria-label="Tapoo browser terminal">
  <div class="page-stage page-stage--terminal">
    <div class="terminal-frame">
      <div id="terminal-body" class="terminal-body">
        <pre id="terminal-screen" aria-live="polite"></pre>
        <span id="terminal-measure" class="terminal-measure">MMMMMMMMMM</span>
        <div id="touch-controls" class="touch-controls" hidden aria-label="Touch game controls">
          <button
            class="touch-controls__button touch-controls__button--walls"
            type="button"
            data-touch-control="true"
            data-action="walls"
            data-config-text
            data-config-key="controls.touch.wallsLabel"
          >
          </button>
          <button
            class="touch-controls__button touch-controls__button--up"
            type="button"
            data-touch-control="true"
            data-move="MoveUp"
            aria-label="Move up"
          >
            <svg class="touch-controls__arrow-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M12 18V6M12 6 6.5 11.5M12 6l5.5 5.5"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3.2"
              />
            </svg>
          </button>
          <button
            class="touch-controls__button touch-controls__button--left"
            type="button"
            data-touch-control="true"
            data-move="MoveLeft"
            aria-label="Move left"
          >
            <svg class="touch-controls__arrow-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M18 12H6M6 12l5.5-5.5M6 12l5.5 5.5"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3.2"
              />
            </svg>
          </button>
          <button
            class="touch-controls__button touch-controls__button--right"
            type="button"
            data-touch-control="true"
            data-move="MoveRight"
            aria-label="Move right"
          >
            <svg class="touch-controls__arrow-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M6 12h12M18 12l-5.5-5.5M18 12l-5.5 5.5"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3.2"
              />
            </svg>
          </button>
          <button
            class="touch-controls__button touch-controls__button--pause"
            type="button"
            data-touch-control="true"
            data-action="pause"
            data-config-text
            data-config-key="controls.touch.pauseLabel"
          >
          </button>
          <button
            class="touch-controls__button touch-controls__button--down"
            type="button"
            data-touch-control="true"
            data-move="MoveDown"
            aria-label="Move down"
          >
            <svg class="touch-controls__arrow-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path
                d="M12 6v12M12 18l-5.5-5.5M12 18l5.5-5.5"
                fill="none"
                stroke="currentColor"
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="3.2"
              />
            </svg>
          </button>
          <button
            class="touch-controls__button touch-controls__button--proceed"
            type="button"
            data-touch-control="true"
            data-action="proceed"
            data-config-text
            data-config-key="controls.touch.proceedLabel"
          >
          </button>
          <button
            class="touch-controls__button touch-controls__button--restart"
            type="button"
            data-touch-control="true"
            data-action="restart"
            aria-label="Caution reset progress"
          >
            <span class="touch-controls__warning" aria-hidden="true">⚠</span>
            <span data-config-text data-config-key="controls.touch.resetProgressLabel"></span>
          </button>
        </div>
        
        <form
          id="agent-config-form"
          class="agent-config-form"
          hidden
          novalidate
          aria-label="New agent configuration"
        >
          <div class="agent-config-form__header">
            <strong data-config-text data-config-key="agentConfig.title"></strong>
            <button
              id="agent-config-close"
              class="agent-config-form__close"
              type="button"
              aria-label="Close new agent form"
            >
              ×
            </button>
          </div>
          <label class="agent-config-form__field">
            <span data-config-text data-config-key="agentConfig.playerNameLabel"></span>
            <input
              id="agent-config-player-name"
              name="playerName"
              type="text"
              autocomplete="off"
              required
              data-config-placeholder="agentConfig.playerNamePlaceholder"
            />
          </label>
          <label class="agent-config-form__field">
            <span data-config-text data-config-key="agentConfig.modelLabel"></span>
            <input
              id="agent-config-model"
              name="model"
              type="text"
              autocomplete="off"
              required
              data-config-placeholder="agentConfig.modelPlaceholder"
            />
          </label>
          <label class="agent-config-form__field">
            <span data-config-text data-config-key="agentConfig.endpointLabel"></span>
            <input
              id="agent-config-endpoint"
              name="endpoint"
              type="text"
              autocomplete="off"
              required
              data-config-placeholder="agentConfig.endpointPlaceholder"
            />
          </label>
          <div class="agent-config-form__actions">
            <label class="agent-config-form__toggle">
              <input
                id="agent-config-enabled"
                name="enabled"
                type="checkbox"
                checked
              />
              <span class="agent-config-form__toggle-control" aria-hidden="true"></span>
              <span data-config-text data-config-key="agentConfig.enabledLabel"></span>
            </label>
            <button
              class="agent-config-form__submit"
              type="submit"
              data-config-text
              data-config-key="agentConfig.submitLabel"
            >
            </button>
          </div>
          <span
            id="agent-config-status"
            class="agent-config-form__status"
            role="status"
            aria-live="polite"
          ></span>
        </form>
      </div>
    </div>
  </div>
</section>
