<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Tapoo Maze Runner | AI Agents</title>
    <meta
      name="description"
      content="Tapoo maze runner AI agents page temporarily unavailable."
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./css/tapoo.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar" aria-label="Application controls">
        <div class="top-bar__brand">
          <strong class="top-bar__title">Tapoo</strong>
          <span class="top-bar__subtitle">maze runner (hide & seek)</span>
          <span class="top-bar__page-tag" aria-current="page">AI Agents</span>
        </div>
        <details class="top-menu">
          <summary class="top-bar__button top-bar__button--icon top-menu__summary" aria-label="More actions">
            <span class="top-menu__icon" aria-hidden="true">
              <svg class="top-menu__icon-svg" viewBox="0 0 24 24" focusable="false">
                <circle cx="8" cy="8" r="2" fill="currentColor" />
                <circle cx="16" cy="8" r="2" fill="currentColor" />
                <circle cx="8" cy="16" r="2" fill="currentColor" />
                <circle cx="16" cy="16" r="2" fill="currentColor" />
              </svg>
            </span>
          </summary>
          <div class="top-menu__panel" role="menu" aria-label="More actions">
            <a class="top-menu__item" href="./index.html" aria-label="Back to game">
              <span class="top-bar__glyph" aria-hidden="true">
                <svg class="top-bar__glyph-svg" viewBox="0 0 24 24" focusable="false">
                  <path
                    d="M9 7 4 12l5 5M5 12h11a4 4 0 0 1 0 8"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                  />
                </svg>
              </span>Back To Game
            </a>
            <a
              class="top-menu__item"
              href="https://www.linkedin.com/in/migwi-ndungu/"
              target="_blank"
              rel="noreferrer noopener"
              aria-label="Contact the developer"
            >
              <span class="top-bar__glyph" aria-hidden="true">
                <svg class="top-bar__glyph-svg" viewBox="0 0 24 24" focusable="false">
                  <path
                    d="M7.2 4.8c.4-.4 1-.5 1.5-.2l2.1 1.2c.6.3.9 1 .6 1.6l-.9 2c-.2.5-.1 1 .2 1.4l2.1 2.1c.4.4.9.5 1.4.2l2-.9c.6-.3 1.3
                     0 1.6.6l1.2 2.1c.3.5.2 1.1-.2 1.5l-1.1 1.1c-.7.7-1.7 1.1-2.7.9-2.2-.4-4.4-1.6-6.4-3.6s-3.2-4.2-3.6-6.4c-.2-1 .2-2 .9-2.7z"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                  />
                </svg>
              </span>Developer
            </a>
          </div>
        </details>
      </header>

      <section class="placeholder-page" aria-label="AI Agents page temporarily unavailable">
        <div class="page-stage page-stage--placeholder">
          <div
            class="placeholder-art"
            role="img"
            aria-label="Page temporarily unavailable"
          ></div>
        </div>
      </section>

      <footer class="page-footer" aria-label="Copyright">
        <small class="page-footer__copy">&copy; 2026 Tapoo</small>
      </footer>
    </main>

    <script src="./js/top-menu.js" defer></script>
  </body>
</html>
