<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title data-config-key="agentsDocumentTitle"></title>
    <meta
      name="description"
      data-config-key="agentsDescription"
      content=""
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./css/tapoo.min.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar" data-config-aria-label data-config-key="appControlsAriaLabel">
        <div class="top-bar__brand">
          <strong class="top-bar__title" data-config-text data-config-key="appName"></strong>
          <span class="top-bar__subtitle" data-config-text data-config-key="appSubtitle"></span>
          <span class="top-bar__page-tag" aria-current="page" data-config-text data-config-key="agentsPageLabel"></span>
        </div>
        <details class="top-menu">
          <summary class="top-bar__button top-bar__button--icon top-menu__summary" data-config-aria-label data-config-key="moreActionsAriaLabel">
            <span class="top-menu__icon" aria-hidden="true">
              <svg class="top-menu__icon-svg" viewBox="0 0 24 24" focusable="false">
                <circle cx="8" cy="8" r="2" fill="currentColor" />
                <circle cx="16" cy="8" r="2" fill="currentColor" />
                <circle cx="8" cy="16" r="2" fill="currentColor" />
                <circle cx="16" cy="16" r="2" fill="currentColor" />
              </svg>
            </span>
          </summary>
          <div class="top-menu__panel" role="menu" data-config-aria-label data-config-key="moreActionsAriaLabel">
            <a class="top-menu__item" href="./index.html" data-config-aria-label data-config-key="backToGameAriaLabel">
              <span class="top-bar__glyph" aria-hidden="true">
                <svg class="top-bar__glyph-svg" viewBox="0 0 24 24" focusable="false">
                  <path
                    d="M9 7 4 12l5 5M5 12h11a4 4 0 0 1 0 8"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                  />
                </svg>
              </span><span data-config-text data-config-key="backToGameLabel"></span>
            </a>
            <a
              class="top-menu__item"
              href="https://www.linkedin.com/in/migwi-ndungu/"
              target="_blank"
              rel="noreferrer noopener"
              data-config-aria-label
              data-config-key="contactAriaLabel"
            >
              <span class="top-bar__glyph" aria-hidden="true">
                <svg class="top-bar__glyph-svg" viewBox="0 0 24 24" focusable="false">
                  <path
                    d="M7.2 4.8c.4-.4 1-.5 1.5-.2l2.1 1.2c.6.3.9 1 .6 1.6l-.9 2c-.2.5-.1 1 .2 1.4l2.1 2.1c.4.4.9.5 1.4.2l2-.9c.6-.3 1.3
                     0 1.6.6l1.2 2.1c.3.5.2 1.1-.2 1.5l-1.1 1.1c-.7.7-1.7 1.1-2.7.9-2.2-.4-4.4-1.6-6.4-3.6s-3.2-4.2-3.6-6.4c-.2-1 .2-2 .9-2.7z"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                  />
                </svg>
              </span><span data-config-text data-config-key="contactLabel"></span>
            </a>
          </div>
        </details>
      </header>

      <section class="placeholder-page" data-config-aria-label data-config-key="agentsPageAriaLabel">
        <div class="page-stage page-stage--placeholder">
          <div
            class="placeholder-art"
            role="img"
            data-config-aria-label
            data-config-key="agentsPageAriaLabel"
          ></div>
        </div>
      </section>

      <footer class="page-footer" data-config-aria-label data-config-key="footerAriaLabel">
        <small class="page-footer__copy" data-page-version></small>
      </footer>
    </main>

    <script src="./js/page-meta.min.js"></script>
    <script src="./js/top-menu.min.js"></script>
  </body>
</html>
