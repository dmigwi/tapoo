<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0d130d" />
    <meta name="color-scheme" content="dark" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; base-uri 'none'; object-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; font-src 'self'; connect-src 'self'; form-action 'none'"
    />
    <title data-config-key="pages.agents.documentTitle">Tapoo Maze Runner | AI Agents</title>
    <meta
      name="description"
      data-config-key="pages.agents.description"
      content="Tapoo maze runner played by an HTTP-driven agent with human session controls."
    />
    <link rel="canonical" href="https://dmigwi.github.io/tapoo/agents.html" />
    <link rel="icon" type="image/svg+xml" href="./images/favicon.svg" />
    <link
      rel="preload"
      href="./fonts/PTMono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./css/tapoo.min.css" />
  </head>
  <body data-tapoo-control-mode="agent-api">
    <main class="app-shell">
      <header class="top-bar" aria-label="Application controls">
        <div class="top-bar__brand">
          <strong class="top-bar__title" data-config-text data-config-key="chrome.appName"></strong>
          <span class="top-bar__subtitle" data-config-text data-config-key="chrome.appSubtitle"></span>
          <span class="top-bar__page-tag" aria-current="page" data-config-text data-config-key="pages.agents.pageLabel"></span>
        </div>
        <details class="top-menu">
          <summary class="top-bar__button top-bar__button--icon top-menu__summary" aria-label="More actions">
            <span class="top-menu__icon" aria-hidden="true">
              <svg class="top-menu__icon-svg" viewBox="0 0 24 24" focusable="false">
                <circle cx="8" cy="8" r="2" fill="currentColor" />
                <circle cx="16" cy="8" r="2" fill="currentColor" />
                <circle cx="8" cy="16" r="2" fill="currentColor" />
                <circle cx="16" cy="16" r="2" fill="currentColor" />
              </svg>
            </span>
          </summary>
          <div class="top-menu__panel" role="menu" aria-label="More actions">
            <a class="top-menu__item" href="./index.html" aria-label="Back to game">
              <span class="top-bar__glyph" aria-hidden="true">
                <svg class="top-bar__glyph-svg" viewBox="0 0 24 24" focusable="false">
                  <path
                    d="M9 7 4 12l5 5M5 12h11a4 4 0 0 1 0 8"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                  />
                </svg>
              </span><span data-config-text data-config-key="pages.agents.backToGameLabel"></span>
            </a>
            <a class="top-menu__item" href="./privacy.html" aria-label="Privacy information">
              <span class="top-bar__glyph" aria-hidden="true">
                <svg class="top-bar__glyph-svg" viewBox="0 0 24 24" focusable="false">
                  <path
                    d="M12 3.5 18 6v5.2c0 3.8-2.4 7.2-6 8.3-3.6-1.1-6-4.5-6-8.3V6z"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                  />
                  <path
                    d="M9.5 12.2 11.2 14l3.5-4"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                  />
                </svg>
              </span><span data-config-text data-config-key="chrome.privacyLabel"></span>
            </a>
            <a
              class="top-menu__item"
              href="https://www.linkedin.com/in/migwi-ndungu/"
              target="_blank"
              rel="noreferrer noopener"
              aria-label="Contact the author"
            >
              <span class="top-bar__glyph" aria-hidden="true">
                <svg class="top-bar__glyph-svg" viewBox="0 0 24 24" focusable="false">
                  <path
                    d="M7.2 4.8c.4-.4 1-.5 1.5-.2l2.1 1.2c.6.3.9 1 .6 1.6l-.9 2c-.2.5-.1 1 .2 1.4l2.1 2.1c.4.4.9.5 1.4.2l2-.9c.6-.3 1.3 0 1.6.6l1.2 2.1c.3.5.2 1.1-.2 1.5l-1.1 1.1c-.7.7-1.7 1.1-2.7.9-2.2-.4-4.4-1.6-6.4-3.6s-3.2-4.2-3.6-6.4c-.2-1 .2-2 .9-2.7z"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                  />
                </svg>
              </span><span data-config-text data-config-key="chrome.contactLabel"></span>
            </a>
          </div>
        </details>
      </header>

      <section id="terminal-app" class="terminal-app" tabindex="0" aria-hidden="true" aria-label="Tapoo browser terminal">
        <div class="page-stage page-stage--terminal">
          <div class="terminal-frame">
            <div id="terminal-body" class="terminal-body">
              <pre id="terminal-screen" aria-live="polite"></pre>
              <span id="terminal-measure" class="terminal-measure">MMMMMMMMMM</span>
              <div id="touch-controls" class="touch-controls" hidden aria-label="Touch game controls">
                <button
                  class="touch-controls__button touch-controls__button--walls"
                  type="button"
                  data-touch-control="true"
                  data-action="walls"
                  data-config-text
                  data-config-key="controls.touch.wallsLabel"
                >
                </button>
                <button
                  class="touch-controls__button touch-controls__button--up"
                  type="button"
                  data-touch-control="true"
                  data-move="MoveUp"
                  aria-label="Move up"
                >
                  <svg class="touch-controls__arrow-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      d="M12 18V6M12 6 6.5 11.5M12 6l5.5 5.5"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="3.2"
                    />
                  </svg>
                </button>
                <button
                  class="touch-controls__button touch-controls__button--left"
                  type="button"
                  data-touch-control="true"
                  data-move="MoveLeft"
                  aria-label="Move left"
                >
                  <svg class="touch-controls__arrow-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      d="M18 12H6M6 12l5.5-5.5M6 12l5.5 5.5"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="3.2"
                    />
                  </svg>
                </button>
                <button
                  class="touch-controls__button touch-controls__button--right"
                  type="button"
                  data-touch-control="true"
                  data-move="MoveRight"
                  aria-label="Move right"
                >
                  <svg class="touch-controls__arrow-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      d="M6 12h12M18 12l-5.5-5.5M18 12l-5.5 5.5"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="3.2"
                    />
                  </svg>
                </button>
                <button
                  class="touch-controls__button touch-controls__button--pause"
                  type="button"
                  data-touch-control="true"
                  data-action="pause"
                  data-config-text
                  data-config-key="controls.touch.pauseLabel"
                >
                </button>
                <button
                  class="touch-controls__button touch-controls__button--down"
                  type="button"
                  data-touch-control="true"
                  data-move="MoveDown"
                  aria-label="Move down"
                >
                  <svg class="touch-controls__arrow-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      d="M12 6v12M12 18l-5.5-5.5M12 18l5.5-5.5"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="3.2"
                    />
                  </svg>
                </button>
                <button
                  class="touch-controls__button touch-controls__button--proceed"
                  type="button"
                  data-touch-control="true"
                  data-action="proceed"
                  data-config-text
                  data-config-key="controls.touch.proceedLabel"
                >
                </button>
                <button
                  class="touch-controls__button touch-controls__button--restart"
                  type="button"
                  data-touch-control="true"
                  data-action="restart"
                  aria-label="Caution reset progress"
                >
                  <span class="touch-controls__warning" aria-hidden="true">⚠</span>
                  <span data-config-text data-config-key="controls.touch.resetProgressLabel"></span>
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>
      <section id="placeholder-art" class="placeholder-page" aria-hidden="false" aria-label="Page status">
        <div class="page-stage page-stage--placeholder">
          <div class="placeholder-art" role="img" aria-label="Page is not available right now"></div>
        </div>
      </section>

      <footer class="page-footer" aria-label="Copyright">
        <small class="page-footer__copy" data-page-version></small>
      </footer>
    </main>

    <script defer src="./js/page-chrome.min.js"></script>
    <script defer src="./js/tapoo.min.js"></script>
  </body>
</html>
