<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title data-config-key="gameDocumentTitle"></title>
    <meta
      name="description"
      data-config-key="gameDescription"
      content=""
    />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="stylesheet" href="./css/tapoo.min.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar" data-config-aria-label data-config-key="appControlsAriaLabel">
        <div class="top-bar__brand">
          <strong class="top-bar__title" data-config-text data-config-key="appName"></strong>
          <span class="top-bar__subtitle" data-config-text data-config-key="appSubtitle"></span>
          <span class="top-bar__page-tag" aria-current="page" data-config-text data-config-key="gamePageLabel"></span>
        </div>
        <details class="top-menu">
          <summary class="top-bar__button top-bar__button--icon top-menu__summary" data-config-aria-label data-config-key="moreActionsAriaLabel">
            <span class="top-menu__icon" aria-hidden="true">
              <svg class="top-menu__icon-svg" viewBox="0 0 24 24" focusable="false">
                <circle cx="8" cy="8" r="2" fill="currentColor" />
                <circle cx="16" cy="8" r="2" fill="currentColor" />
                <circle cx="8" cy="16" r="2" fill="currentColor" />
                <circle cx="16" cy="16" r="2" fill="currentColor" />
              </svg>
            </span>
          </summary>
          <div class="top-menu__panel" role="menu" data-config-aria-label data-config-key="moreActionsAriaLabel">
            <a class="top-menu__item" href="./agents.html" data-config-aria-label data-config-key="aiAgentsPageAriaLabel">
              <span class="top-bar__glyph" aria-hidden="true">
                <svg class="top-bar__glyph-svg" viewBox="0 0 24 24" focusable="false">
                  <path
                    d="M12 4.5 14.2 9.8 19.5 12l-5.3 2.2L12 19.5l-2.2-5.3L4.5 12l5.3-2.2z"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                  />
                </svg>
              </span><span data-config-text data-config-key="aiAgentsLabel"></span>
            </a>
            <button class="top-menu__item" type="button" data-action="restart" data-config-aria-label data-config-key="resetProgressAriaLabel">
              <span class="top-bar__warning" aria-hidden="true">⚠</span><span data-config-text data-config-key="resetProgressLabel"></span>
            </button>
            <a
              class="top-menu__item"
              href="https://www.linkedin.com/in/migwi-ndungu/"
              target="_blank"
              rel="noreferrer noopener"
              data-config-aria-label
              data-config-key="contactAriaLabel"
            >
              <span class="top-bar__glyph" aria-hidden="true">
                <svg class="top-bar__glyph-svg" viewBox="0 0 24 24" focusable="false">
                  <path
                    d="M7.2 4.8c.4-.4 1-.5 1.5-.2l2.1 1.2c.6.3.9 1 .6 1.6l-.9 2c-.2.5-.1 1 .2 1.4l2.1 2.1c.4.4.9.5 1.4.2l2-.9c.6-.3
                     1.3 0 1.6.6l1.2 2.1c.3.5.2 1.1-.2 1.5l-1.1 1.1c-.7.7-1.7 1.1-2.7.9-2.2-.4-4.4-1.6-6.4-3.6s-3.2-4.2-3.6-6.4c-.2-1 .2-2 .9-2.7z"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                    stroke-width="1.8"
                  />
                </svg>
              </span><span data-config-text data-config-key="contactLabel"></span>
            </a>
          </div>
        </details>
      </header>

      <section id="terminal-app" class="terminal-app" tabindex="0" data-config-aria-label data-config-key="terminalAriaLabel">
        <div class="page-stage page-stage--terminal">
          <div class="terminal-frame">
            <div id="terminal-body" class="terminal-body">
              <pre id="terminal-screen" aria-live="polite"></pre>
              <span id="terminal-measure" class="terminal-measure">MMMMMMMMMM</span>
              <div id="touch-controls" class="touch-controls" hidden data-config-aria-label data-config-key="touchControlsAriaLabel">
                <button
                  class="touch-controls__button touch-controls__button--walls"
                  type="button"
                  data-touch-control="true"
                  data-action="walls"
                  data-config-text
                  data-config-key="wallsTouchLabel"
                >
                </button>
                <button
                  class="touch-controls__button touch-controls__button--up"
                  type="button"
                  data-touch-control="true"
                  data-move="MoveUp"
                  data-config-aria-label
                  data-config-key="touchMoveUpAriaLabel"
                >
                  <svg class="touch-controls__arrow-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      d="M12 18V6M12 6 6.5 11.5M12 6l5.5 5.5"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="3.2"
                    />
                  </svg>
                </button>
                <button
                  class="touch-controls__button touch-controls__button--left"
                  type="button"
                  data-touch-control="true"
                  data-move="MoveLeft"
                  data-config-aria-label
                  data-config-key="touchMoveLeftAriaLabel"
                >
                  <svg class="touch-controls__arrow-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      d="M18 12H6M6 12l5.5-5.5M6 12l5.5 5.5"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="3.2"
                    />
                  </svg>
                </button>
                <button
                  class="touch-controls__button touch-controls__button--right"
                  type="button"
                  data-touch-control="true"
                  data-move="MoveRight"
                  data-config-aria-label
                  data-config-key="touchMoveRightAriaLabel"
                >
                  <svg class="touch-controls__arrow-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      d="M6 12h12M18 12l-5.5-5.5M18 12l-5.5 5.5"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="3.2"
                    />
                  </svg>
                </button>
                <button
                  class="touch-controls__button touch-controls__button--pause"
                  type="button"
                  data-touch-control="true"
                  data-action="pause"
                  data-config-text
                  data-config-key="pauseTouchLabel"
                >
                </button>
                <button
                  class="touch-controls__button touch-controls__button--down"
                  type="button"
                  data-touch-control="true"
                  data-move="MoveDown"
                  data-config-aria-label
                  data-config-key="touchMoveDownAriaLabel"
                >
                  <svg class="touch-controls__arrow-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path
                      d="M12 6v12M12 18l-5.5-5.5M12 18l5.5-5.5"
                      fill="none"
                      stroke="currentColor"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                      stroke-width="3.2"
                    />
                  </svg>
                </button>
                <button
                  class="touch-controls__button touch-controls__button--proceed"
                  type="button"
                  data-touch-control="true"
                  data-action="proceed"
                  data-config-text
                  data-config-key="proceedTouchLabel"
                >
                </button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <footer class="page-footer" data-config-aria-label data-config-key="footerAriaLabel">
        <small class="page-footer__copy" data-page-version></small>
      </footer>
    </main>

    <script src="./js/page-meta.min.js"></script>
    <script src="./js/top-menu.min.js"></script>
    <script src="./js/tapoo.min.js"></script>
  </body>
</html>
